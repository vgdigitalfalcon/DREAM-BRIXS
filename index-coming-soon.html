<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamBrixs | Residential Builders | Coming Soon</title>
    <meta name="description" content="DreamBrixs Residential Builders &mdash; Crafting premium homes in Chennai. Our new website is launching soon.">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-navy: #0a1628;
            --accent-yellow: #F5B800;
            --accent-orange: #E89B00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(160deg, #0a1628 0%, #122036 50%, #0a1628 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-shape {
            position: absolute; border-radius: 50%; opacity: 0.06;
            animation: float 14s ease-in-out infinite; pointer-events: none;
        }
        .bg-shape-1 { width: 380px; height: 380px; background: var(--accent-yellow); top: -100px; right: -100px; }
        .bg-shape-2 { width: 280px; height: 280px; background: var(--accent-yellow); bottom: -80px; left: -80px; animation-delay: -5s; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        .wrap {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 1; padding: 40px 20px;
        }
        .content { max-width: 640px; text-align: center; }

        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(245,184,0,0.12); border: 1px solid rgba(245,184,0,0.35);
            padding: 7px 18px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
            letter-spacing: 1px; color: var(--accent-yellow); margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(32px, 6.5vw, 52px);
            font-weight: 800; line-height: 1.15; margin-bottom: 14px;
        }
        h1 span { color: var(--accent-yellow); }

        .tagline {
            font-size: 16px; color: rgba(255,255,255,0.75);
            max-width: 480px; margin: 0 auto 32px; line-height: 1.65;
        }

        .services {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            margin-bottom: 36px;
        }
        .service-pill {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .service-pill i { color: var(--accent-yellow); font-size: 12px; }

        .contact-row {
            display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
        }
        .contact-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, var(--accent-yellow), #ffd34d);
            color: #101010; text-decoration: none; font-weight: 700;
            padding: 12px 22px; border-radius: 999px; font-size: 14px;
            transition: all 0.3s ease;
        }
        .contact-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,184,0,0.3); color: #101010; }
        .contact-btn.outline {
            background: transparent; border: 1.5px solid rgba(255,255,255,0.25); color: #fff;
        }
        .contact-btn.outline:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); background: transparent; box-shadow: none; }

        .footer-note {
            position: absolute; bottom: 18px; left: 0; right: 0;
            text-align: center; font-size: 12px; color: rgba(255,255,255,0.35);
        }

        @media (max-width: 576px) {
            h1 { font-size: 30px; }
            .tagline { font-size: 15px; }
            .contact-row { flex-direction: column; align-items: center; }
            .contact-btn { width: 100%; max-width: 280px; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="wrap">
        <div class="content">
            <div class="badge">
                <i class="fas fa-hard-hat"></i> DREAMBRIXS
            </div>

            <h1>Building Your<br><span>Dream Home.</span></h1>
            <p class="tagline">
                Premium residential construction in Chennai. Our new website is launching soon.
            </p>

            <div class="services">
                <span class="service-pill"><i class="fas fa-home"></i> Individual Houses</span>
                <span class="service-pill"><i class="fas fa-building"></i> Villas</span>
                <span class="service-pill"><i class="fas fa-city"></i> Apartments</span>
                <span class="service-pill"><i class="fas fa-project-diagram"></i> Project Development</span>
            </div>

            <div class="contact-row">
                <a href="tel:+919941769381" class="contact-btn"><i class="fas fa-phone"></i> Call Us</a>
                <a href="https://wa.me/919941769381" class="contact-btn outline" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="mailto:balajimani.2505@gmail.com" class="contact-btn outline"><i class="fas fa-envelope"></i> Email</a>
            </div>
        </div>
    </div>

    <div class="footer-note">&copy; 2026 DreamBrixs Residential Builders &bull; Chennai</div>
</body>
</html>
